<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGMA FLEX — Fractional GC</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0; padding:0; box-sizing:border-box;}
body{font-family:'Inter', sans-serif; background:#0F2A20; overflow-x:hidden; color:#fff;}

header{position:fixed; top:0; left:0; width:100%; height:78px; background:#0A1410; display:flex; align-items:center; justify-content:space-between; padding:0 5%; z-index:100; border-bottom:1px solid rgba(200,176,144,.15);}
header img{height:36px; filter: brightness(0) invert(1);}
header nav{display:flex; align-items:center;}
header nav a{color:rgba(255,255,255,.7); text-decoration:none; font-size:11px; letter-spacing:3px; text-transform:uppercase; margin-left:32px; transition:.3s;}
header nav a:hover{color:#fff;}
header nav a.btn{border:1px solid #C8B090; padding:10px 18px; color:#C8B090;}
header nav a.btn:hover{background:#D8C0A1; color:#0A1410; border-color:#D8C0A1;}

.hero-flex{
  min-height:100vh;
  background:#122A1F;
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:60px;
  padding:170px 8% 120px 8%;
  align-items:center;
}
.eyebrow-mini{border:1px solid rgba(200,176,144,.4); color:#C8B090; font-size:9px; letter-spacing:4px; text-transform:uppercase; padding:8px 14px; display:inline-block; margin-bottom:32px;}
.hero-flex h1{font-family:'Playfair Display'; font-size:62px; line-height:0.95; font-weight:300; color:#fff;}
.hero-flex h1 i{color:#C8B090; font-style:italic; font-weight:300;}
.sub-latam{margin-top:28px; display:flex; align-items:center; gap:14px; color:#fff; font-size:10px; letter-spacing:4px; text-transform:uppercase;}
.sub-latam::before{content:''; width:32px; height:1px; background:#C8B090; display:block;}
.hero-desc{margin-top:22px; color:rgba(255,255,255,.6); font-size:14px; line-height:1.7; max-width:420px;}

.sec-claro{background:#F7F3EB; padding:100px 8%; color:#102821;}
.sec-claro .eyebrow{color:#C8B090; font-size:10px; letter-spacing:4px; text-transform:uppercase; display:block; margin-bottom:16px;}
.titulo-sec{font-family:'Playfair Display'; font-size:42px; font-weight:300; line-height:1.1; margin-bottom:40px;}
.titulo-sec.osc{color:#102821;}
.titulo-sec.claro{color:#fff;}

.grid3{display:grid; grid-template-columns:repeat(3, 1fr); gap:1px; background:rgba(16,40,33,.1); border:1px solid rgba(16,40,33,.1);}
.card{background:#fff; padding:36px 28px;}
.card svg{width:32px; height:32px; stroke:#102821; stroke-width:1.3; fill:none; margin-bottom:22px; display:block;}
.card h3{font-family:'Playfair Display'; font-size:19px; color:#102821; margin-bottom:12px;}
.card p{font-size:13px; line-height:1.7; color:rgba(16,40,33,.7);}

.sec-oscuro{background:#102821; padding:100px 8%;}
.tabla-comp{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.1); margin-top:30px;}
.col-comp{padding:36px;}
.col-comp.trad{background:#0A1A15;}
.col-comp.flex{background:#0F2A20; border:1px solid #C8B090;}
.col-comp h4{font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:18px;}
.col-comp.trad h4{color:rgba(255,255,255,.5);}
.col-comp.flex h4{color:#C8B090;}
.col-comp ul{list-style:none;}
.col-comp li{font-size:13px; line-height:1.6; margin-bottom:12px; opacity:.7;}
.col-comp.flex li{color:#fff; opacity:.9;}

.plans{display:grid; grid-template-columns:repeat(3, 1fr); gap:1px; background:rgba(16,40,33,.12); border:1px solid rgba(16,40,33,.12); margin-top:20px;}
.plan{background:#fff; padding:36px 28px;}
.plan.destacado{background:#102821; color:#fff; border:1px solid #C8B090;}
.plan h5{font-size:11px; letter-spacing:3px; text-transform:uppercase; margin-bottom:16px;}
.plan .price{font-family:'Playfair Display'; font-size:28px; margin-bottom:14px;}
.plan ul{list-style:none; margin-top:14px;}
.plan li{font-size:12px; line-height:1.6; margin-bottom:8px; opacity:.7;}
.plan.destacado li{opacity:.85;}

.btn-flex{background:#C8B090; color:#102821; padding:16px 28px; text-decoration:none; font-size:11px; letter-spacing:3px; text-transform:uppercase; display:inline-block; font-weight:500;}

/* PRELOADER ARREGLADO */
#preloader-flex{position:fixed; inset:0; background:#0A1410; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; transition:opacity .6s ease;}
#preloader-flex.oculto{opacity:0; pointer-events:none;}

footer{padding:30px 8%; background:#102821; text-align:center; color:rgba(255,255,255,.4); font-size:11px; letter-spacing:2px;}

@media(max-width:900px){
.hero-flex{grid-template-columns:1fr; padding:120px 6% 60px 6%;}
.grid3, .plans, .tabla-comp{grid-template-columns:1fr;}
.hero-flex h1{font-size:44px;}
}
</style>
</head>
<body>

<div id="preloader-flex">
  <img src="nombre-logo-estudio.webp" alt="RGMA" style="height:42px; width:auto; filter: brightness(0) invert(1);">
  <span style="color:#C8B090; letter-spacing:6px; font-size:10px;">RGMA FLEX</span>
</div>

<header>
  <a href="index.html"><img src="nombre-logo-estudio.webp" alt="RGMA"></a>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="flex.html" class="btn">Área Flex</a>
  </nav>
</header>

<section class="hero-flex">
  <div>
    <span class="eyebrow-mini">Fractional GC para Latam</span>
    <h1>Gobierno Corporativo <i>flexible</i> para escalar</h1>
    <div class="sub-latam">Latam Ready</div>
    <p class="hero-desc">Tu área legal externa bajo modelo fraccional. La estructura de un estudio grande, con la agilidad de un equipo dedicado.</p>
  </div>
  <div>
    <!-- acá va tu contenido/visual del hero -->
  </div>
</section>

<footer>RGMA — ESTUDIO JURÍDICO</footer>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const pre = document.getElementById('preloader-flex');
      pre.classList.add('oculto');
      setTimeout(() => pre.style.display='none', 700);
    }, 1000);
  });
</script>

</body>
</html>
